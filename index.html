<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sea Loder 2.0</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-screen">
      <canvas id="game" width="1280" height="720" aria-label="Sea Loder 2.0"></canvas>

      <div class="hud-top">
        <span class="logo">Sea Loder 2.0</span>
        <span id="control-profile-badge">Профиль: ПК</span>
      </div>

      <div class="edge-controls edge-controls-left" aria-label="Кнопки движения">
        <button class="edge-btn" data-action="w">▲</button>
        <div class="edge-row">
          <button class="edge-btn" data-action="a">◀</button>
          <button class="edge-btn" data-action="s">▼</button>
          <button class="edge-btn" data-action="d">▶</button>
        </div>
      </div>

      <div class="edge-controls edge-controls-right" aria-label="Кнопки действий">
        <button class="edge-btn" data-action="interact">E</button>
        <button class="edge-btn" data-action="sonar">СКАН</button>
        <button class="edge-btn" data-action="upgrade1">1</button>
        <button class="edge-btn" data-action="upgrade2">2</button>
        <button class="edge-btn" data-action="upgrade3">3</button>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
