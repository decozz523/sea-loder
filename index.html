<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sea Loder — исследование островов</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <header>
        <h1>Sea Loder: корабль и острова</h1>
        <p>
          <strong>Режим корабля:</strong> W/S — ход, A/D — поворот, E — высадка/док.
          <strong>Режим персонажа:</strong> WASD — движение, E — собрать ресурс.
          На базе нажмите <strong>1/2/3</strong> для улучшений.
        </p>
      </header>
      <section class="game-wrap">
        <canvas id="game" width="960" height="540" aria-label="Игра про корабль и острова"></canvas>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
